# n_aspMain (n_audio RSP microcode) — text at vram 0x80060120 (ROM 0x60D20),
# data at 0x800A8130; set up by the audio init at 0x8001F948.
# rspboot loads ucode text at IMEM 0x1080 (the first 0x80 bytes hold the boot
# code), so text_address is 0x04001080: absolute j/jal targets are IMEM addresses.
text_offset = 0x60D20
text_size = 0xC60
text_address = 0x04001080
rom_file_path = "../rom/baserom.us.z64"
output_file_path = "../rsp/n_aspMain.cpp"
output_function_name = "n_aspMain"
# Command dispatch table: first 16 halfwords of DMEM data (IMEM addresses).
# Entry 14 (0x02B0) is the DMEM command-buffer address, not code.
extra_indirect_branch_targets = [
    0x10EC, 0x139C, 0x119C, 0x1A64, 0x11C8, 0x17EC, 0x1208,
    0x127C, 0x1348, 0x1248, 0x1C84, 0x12D4, 0x1384,
]
