# N64Recomp config for Hey You, Pikachu! (USA)
# Run from the repo root: external/N64Recomp/build/N64Recomp.exe hyp.recomp.toml

[input]
entrypoint = 0x80000400
symbols_file_path = "syms/hyp.syms.toml"
rom_file_path = "rom/baserom.us.z64"
output_func_path = "RecompiledFuncs"

[patches]
stubs = []
# Only reachable from libultra functions the runtime reimplements:
#   vimgr_text_0180 = VI manager thread body (osCreateViManager)
#   func_80051E48   = motor.c static helper (osMotorInit / __osMotorAccess)
ignored = ["vimgr_text_0180", "func_80051E48"]

# --- Debug trace hooks (stage-code loading investigation; see src/debug_trace.cpp) ---
[[patches.hook]]
func = "dmaCopy"
before_vram = 0x80037B1C
text = "hyp_trace_dma(rdram, ctx);"

[[patches.hook]]
func = "func_8002D010"
before_vram = 0x8002D010
text = "hyp_trace_decompress(rdram, ctx);"

[[patches.hook]]
func = "func_80033A70"
before_vram = 0x80033A70
text = "hyp_trace_stage_load(rdram, ctx);"

# Register every overlay the game loads with the runtime (src/overlay_hooks.cpp).
[[patches.hook]]
func = "overlayLoad"
before_vram = 0x800135C0
text = "hyp_on_overlay_load(rdram, ctx);"

# Trace save-thread requests (op 0 = read, 1 = write): {?, op, done, result, block, ?, data, size}
[[patches.hook]]
func = "func_80003938"
before_vram = 0x80003938
text = "hyp_trace_save_request(rdram, ctx);"

# Test aid (HYP_FORCE_SAVE_AT): per-frame check on the main game-logic thread (30),
# which is where the game issues its own saves. (Not vruPoll: that runs on the
# service thread that executes save requests, so saving from it would self-deadlock.)
[[patches.hook]]
func = "func_8000BB8C"
before_vram = 0x8000BC34
text = "hyp_force_save_check(rdram, ctx);"
